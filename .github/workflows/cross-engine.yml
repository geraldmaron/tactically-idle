name: Cross-engine fingerprints
# Issued incidents and generated buildings regenerate from their IDs on the player's engine.
# The fingerprint JSON is captured under Node (V8); this recomputes it under Bun (JavaScriptCore).
# The script needs no npm packages: Bun runs the TypeScript sources directly.
on:
  pull_request:
permissions:
  contents: read
concurrency:
  group: cross-engine-${{ github.ref }}
  cancel-in-progress: true
jobs:
  javascriptcore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14 # the version the fingerprints were last checked with locally
      - run: bun --version
      - run: bun scripts/cross-engine-fingerprints.ts
